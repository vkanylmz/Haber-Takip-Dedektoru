name: Deploy splash page to GitHub Pages

# Render'ın ücretsiz katmanındaki spin-down sırasında kendi marka/logolu
# yükleniyor ekranını göstermek için (bkz. splash-page/index.html) - GitHub
# Pages klasik ayardan yalnızca kök dizini veya /docs klasörünü serve
# edebildiğinden, sadece splash-page/ alt klasörünü Pages'e deploy etmek için
# ayrı bir Actions workflow'u kullanılıyor.
on:
  push:
    branches: [main]
    paths:
      - "splash-page/**"
      - ".github/workflows/deploy-splash.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload splash-page/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: splash-page

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
