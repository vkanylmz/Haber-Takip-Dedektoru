# Render.com "Blueprint" yapılandırması (bkz. README > "Render'a Deploy").
#
# ÖNEMLİ MİMARİ NOT: Vercel'in aksine, Render bu uygulamayı GERÇEK, SÜREKLİ
# çalışan bir Python süreci olarak (serverless fonksiyon DEĞİL) barındırır -
# bu yüzden `api/index.py` (Vercel için hazırlanmıştı) HİÇBİR KOD DEĞİŞİKLİĞİ
# OLMADAN burada da çalışır: aynı dosya, yerelde zaten `uvicorn api.index:app`
# ile test edildi ve gerçek Neon Postgres verisiyle doğrulandı.
#
# Bu da SALT-OKUNUR dashboard'dur - worker (RSS taraması) ve Telegram bot
# dinleyicisi burada YOK, onlar hâlâ yerel bilgisayarda `python main.py` ile
# çalışmaya devam ediyor, AYNI DATABASE_URL (Neon Postgres) üzerinden veri
# paylaşıyor (bkz. README > Hibrit Mimari).
services:
  - type: web
    name: finans-haber-dashboard
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # KASITLI OLARAK TEK worker (--workers belirtilmedi, uvicorn varsayılanı
    # 1'dir - plain `uvicorn` zaten WEB_CONCURRENCY'yi OKUMAZ, o yalnızca
    # gunicorn'un okuduğu bir konvansiyondur; Render loglarında görülen
    # "Setting WEB_CONCURRENCY=1" satırı Render'ın genel Python build
    # aracının bilgilendirici çıktısıdır, BİZİM uvicorn çağrımızı ETKİLEMEZ).
    #
    # BİRDEN FAZLA worker EKLEMEYİN (2026-07'de araştırıldı/ölçüldü, bkz.
    # README > "Çoklu Kullanıcı Performansı"): Free plan yalnızca 0.1 vCPU +
    # 512MB RAM veriyor - zaten kıt olan CPU'yu birden fazla worker'a
    # bölmek YARDIMCI OLMAZ (her worker daha da az CPU payı alır), ÜSTELİK
    # her worker AYRI bir Python süreci olduğundan piyasa verisi önbelleği/
    # kilidi (bkz. src/web/market_data.py > _cache, _refresh_lock) SÜREÇ
    # BAŞINA ayrı olur - N worker, N kat Yahoo Finance isteği anlamına
    # gelir, tam da düzeltilen "thundering herd" sorununu WORKER'LAR ARASI
    # olarak GERİ GETİRİR. Tek worker + asyncio kilidi, mevcut trafik
    # ölçeği için doğru çözüm.
    startCommand: "uvicorn api.index:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # DATABASE_URL BİLEREK burada YOK - gerçek değeri Render panelinden
      # elle gireceksiniz (bkz. README), asla bu dosyaya/repoya gömülmez.
      - key: DATABASE_URL
        sync: false
