<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finansal Haber Terminali — Yükleniyor</title>
  <style>
    :root {
      --bg: #09090b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-a: #60a5fa;
      --accent-b: #a78bfa;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(167, 139, 250, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      text-align: center;
      padding: 1.5rem;
    }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      max-width: 420px;
    }

    .logo-emoji {
      font-size: 4rem;
      line-height: 1;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.08);
        opacity: 0.75;
      }
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(to right, var(--accent-a), var(--accent-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .status-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--accent-a);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .slow-message {
      display: none;
      font-size: 0.82rem;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="splash">
    <div class="logo-emoji">📊</div>
    <h1 class="brand">Finansal Haber Terminali</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p class="status-text" id="status-text">Site yükleniyor...</p>
    <p class="slow-message" id="slow-message">
      Biraz uzun sürüyor, sabrınız için teşekkürler — sunucu "uyku" modundan
      uyanıyor, birazdan hazır olacak.
    </p>
  </div>

  <script>
    (function () {
      // --- Ayarlar: gerçek backend adresiniz burada ---
      // NOT (2026-08-21): Render backend'i (finans-haber-dashboard.onrender.com)
      // artık kullanılmıyor (boş/veri yok) - şu an ev bilgisayarındaki sunucuya
      // Cloudflare Tunnel "quick tunnel" üzerinden yönlendiriliyor. BU ADRES
      // GEÇİCİDİR: cloudflared her yeniden başladığında (bilgisayar/servis
      // restart, watchdog müdahalesi vb.) YENİ bir *.trycloudflare.com adresi
      // üretir - güncel adres restart_tunnel.ps1 tarafından
      // data/state/tunnel_url.txt dosyasına yazılır. Kalıcı bir domain/named
      // tunnel kurulduğunda burası o sabit adresle güncellenmeli.
      var BACKEND_ROOT = "https://brother-participated-singles-follows.trycloudflare.com";
      var HEALTH_URL = BACKEND_ROOT + "/health";
      var POLL_INTERVAL_MS = 2500;
      var SLOW_THRESHOLD_MS = 60000;

      var startedAt = Date.now();
      var slowMessageShown = false;
      var slowMessageEl = document.getElementById("slow-message");

      function goToRealSite() {
        window.location.href = BACKEND_ROOT + "/";
      }

      function maybeShowSlowMessage() {
        if (slowMessageShown) return;
        if (Date.now() - startedAt <= SLOW_THRESHOLD_MS) return;
        slowMessageShown = true;
        if (slowMessageEl) slowMessageEl.style.display = "block";
      }

      function scheduleNextCheck() {
        maybeShowSlowMessage();
        setTimeout(checkBackend, POLL_INTERVAL_MS);
      }

      // Not: setInterval YERİNE kasıtlı olarak recursive setTimeout kullanılıyor -
      // cold start sırasında bir istek yanıt vermesi uzun sürerse (örn. 10+ sn),
      // setInterval üst üste binen (overlapping) yeni istekler başlatabilirdi;
      // bu yaklaşım bir önceki istek TAMAMEN bitmeden (başarılı/başarısız) yeni
      // bir istek başlatmaz.
      function checkBackend() {
        fetch(HEALTH_URL, { method: "GET", mode: "cors", cache: "no-store" })
          .then(function (response) {
            if (response.ok) {
              goToRealSite();
              return;
            }
            // 200 dışında bir kod (ör. 502/503) - backend henüz tam ayakta
            // değil, sessizce tekrar dene.
            scheduleNextCheck();
          })
          .catch(function () {
            // Network hatası / CORS engeli / henüz hiç yanıt yok - sessizce
            // tekrar dene, kullanıcıya hata gösterme (gereksinim #4).
            scheduleNextCheck();
          });
      }

      checkBackend();
    })();
  </script>
</body>

</html>
